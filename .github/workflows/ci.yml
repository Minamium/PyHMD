name: CPU and package contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,viz]'
      - run: make test
      - run: make test-python
      - run: make test-convergence
      - run: pymhd run examples/thin_disk_cpu.json --out runs/ci_smoke
      - run: pymhd validate runs/ci_smoke
      - run: pymhd render runs/ci_smoke
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip wheel --no-deps . -w dist
      - run: python -m pip install --no-deps dist/*.whl
      - name: Build and run installed bundled native sources outside checkout
        working-directory: /tmp
        run: |
          pymhd build --backend cpu --build-dir /tmp/pymhd-wheel-build
          pymhd init --problem alfven --output /tmp/pymhd-wheel.json
          pymhd run /tmp/pymhd-wheel.json --build-dir /tmp/pymhd-wheel-build --out /tmp/pymhd-wheel-result
          pymhd validate /tmp/pymhd-wheel-result
