[problem]
case = diffusion
geometry = cartesian
gamma = 1.6666666666666667
gm = 0
eta_model = constant
eta = 0.01
wave_amplitude = 0.001

[grid]
nx1 = 128
nx2 = 4
radial_grid = uniform
x1_min = 0
x1_max = 1
x2_min = 0
x2_max = 0.125
lower1 = periodic
upper1 = periodic
lower2 = periodic
upper2 = periodic

[time]
cfl = 0.4
t_end = 0.2
output_interval = 0.05
log_interval = 50
output = runs/diffusion
