# SF2014-inspired axisymmetric polytropic thin disk. See docs/numerical_model.md.
# These explicit model choices are not a claim of bitwise PLUTO equivalence.
[problem]
case = thin_disk
geometry = spherical
gm = 1
gamma = 1.6666666666666667
h = 0.1
corona = 0.001
# b0 is derived from h*sqrt(2*mu0*GM).
mu0 = 0.01
mu_ref = 0.01
bend = 0.5
# Named resolution of the initializer ambiguity in SF2014.
initial_equilibrium = magnetohydrostatic
inner_normal_field = evolve
cfl_staggered = yes
ct_emf_scheme = face_hll
eta_model = sf2014
eta = 0.001
alpha_m = 1.65
chi = 0.5
cooling = yes
rho_floor = 1e-10
p_floor = 1e-12
thermal_recovery = internal_energy
internal_energy_sync = modern
dual_energy_eta = 1e-3
entropy_ratio = 1e-3
ct_energy_correction = yes
entropy_shock_threshold = 0.05
max_step_retries = 8
retry_flat_same_dt = yes
# Strict default. The explicit floor comparison is available separately.
negative_pressure_policy = retry
reconstruction_cache = yes
metric_ppm = yes

[grid]
nx1 = 600
nx2 = 128
radial_grid = log
x1_min = 1
x1_max = 1500
x2_min = 0
x2_max = 1.5707963267948966
lower1 = paper_inner
upper1 = paper_outer
lower2 = axis
upper2 = equator

[time]
cfl = 0.4
t_end = 100
max_steps = 100000000
output_interval = 10
log_interval = 100

[output]
output = runs/thin_disk
