# Phase 0 benchmark, conventions in docs/phase0.md
[run]
case = oblique_alfven
geometry = cartesian
radial_grid = uniform
gamma = 1.6666666666666667
gm = 0
eta = 0
eta_model = constant
cooling = no
lower1 = periodic
upper1 = periodic
lower2 = periodic
upper2 = periodic
ct_emf_scheme = face_hll
