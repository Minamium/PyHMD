ct_energy_correction = no
cfl = 0.4
output_interval = 0.1
log_interval = 50
nx1 = 64
nx2 = 32
x1_min = 0
x1_max = 2.23606797749979
x2_min = 0
x2_max = 1.118033988749895
wave_amplitude = 0.1
t_end = 1
output = runs/oblique_alfven
