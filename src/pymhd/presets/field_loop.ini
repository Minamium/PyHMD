# Phase 0 benchmark, conventions in docs/phase0.md
[run]
case = field_loop
geometry = cartesian
radial_grid = uniform
gamma = 1.6666666666666667
gm = 0
eta = 0
eta_model = constant
cooling = no
lower1 = periodic
upper1 = periodic
lower2 = periodic
upper2 = periodic
ct_emf_scheme = face_hll
thermal_recovery = off
internal_energy_sync = legacy
ct_energy_correction = no
cfl = 0.4
output_interval = 0.1
log_interval = 50
nx1 = 64
nx2 = 32
x1_min = -1
x1_max = 1
x2_min = -0.5
x2_max = 0.5
wave_amplitude = 0.001
t_end = 1
output = runs/field_loop
